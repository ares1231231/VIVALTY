{% load web_extras %}
<div class="relative hidden lg:block" id="locale-switcher" hx-boost="false">
  <button type="button" id="locale-switcher-btn"
          class="vv-locale"
          aria-haspopup="listbox" aria-expanded="false"
          aria-controls="locale-menu"
          aria-label="Change language">
    <svg class="h-4 w-4 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
    <span class="vv-locale-text uppercase">{{ UI_LANGUAGE }}</span>
    <svg class="locale-switcher-caret h-3 w-3 opacity-60 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
  </button>
  <div id="locale-menu" hidden
       class="absolute right-0 z-[60] mt-2 w-44 overflow-hidden rounded-xl border border-ink-200 bg-white py-1 shadow-2xl">
    {% for code, label in UI_LANGUAGES %}
      <form action="{% url 'web:set_language' %}" method="post" class="block" hx-boost="false">
        {% csrf_token %}
        <input type="hidden" name="language" value="{{ code }}" />
        <input type="hidden" name="next" value="{{ request.get_full_path }}" />
        <button type="submit"
                class="flex w-full items-center justify-between px-4 py-2.5 text-sm font-medium transition-colors
                       {% if code == UI_LANGUAGE %}bg-brand-50 text-brand-800{% else %}text-ink-700 hover:bg-ink-50{% endif %}"
                {% if code == 'ar' %}dir="rtl"{% endif %}>
          {{ label }}
          {% if code == UI_LANGUAGE %}<span class="text-brand-600" aria-hidden="true">✓</span>{% endif %}
        </button>
      </form>
    {% endfor %}
  </div>
</div>

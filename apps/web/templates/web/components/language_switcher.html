{% load web_extras %}
<div class="relative" x-data="{ open: false }" @keydown.escape.window="open = false">
  <button type="button" @click="open = !open"
          class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold transition-colors
                 {% if url_name == 'home' %}text-white/85 hover:bg-white/10{% else %}text-ink-600 hover:bg-ink-100 hover:text-ink-900{% endif %}"
          aria-haspopup="listbox" :aria-expanded="open">
    <svg class="h-4 w-4 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
    <span class="uppercase">{{ UI_LANGUAGE }}</span>
    <svg class="h-3 w-3 opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
  </button>
  <div x-show="open" x-cloak @click.outside="open = false"
       x-transition.origin.top.right
       class="absolute right-0 z-50 mt-2 w-44 overflow-hidden rounded-xl border border-ink-200 bg-white py-1 shadow-2xl">
    {% for code, label in UI_LANGUAGES %}
      <form action="{% url 'set_language' %}" method="post" class="block">
        {% csrf_token %}
        <input type="hidden" name="language" value="{{ code }}" />
        <input type="hidden" name="next" value="{{ request.get_full_path }}" />
        <button type="submit"
                class="flex w-full items-center justify-between px-4 py-2.5 text-sm font-medium transition-colors
                       {% if code == UI_LANGUAGE %}bg-brand-50 text-brand-800{% else %}text-ink-700 hover:bg-ink-50{% endif %}"
                {% if code == 'ar' %}dir="rtl"{% endif %}>
          {{ label }}
          {% if code == UI_LANGUAGE %}<span class="text-brand-600">✓</span>{% endif %}
        </button>
      </form>
    {% endfor %}
  </div>
</div>

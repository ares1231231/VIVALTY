{% load static %}
{# Google tag (gtag.js) + Consent Mode v2 — tag always present; storage granted on Accept all. #}
{% if GA4_MEASUREMENT_ID %}
<span class="hidden" data-vivalty-analytics-ack-sign-up="{% url 'web:analytics_ack_sign_up' %}" hidden></span>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ GA4_MEASUREMENT_ID|urlencode }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("consent", "default", {
    analytics_storage: "denied",
    ad_storage: "denied",
    ad_user_data: "denied",
    ad_personalization: "denied",
    wait_for_update: 500
  });
  gtag("js", new Date());
  gtag("config", "{{ GA4_MEASUREMENT_ID|escapejs }}");
  {% if GOOGLE_ADS_ID %}
  gtag("config", "{{ GOOGLE_ADS_ID|escapejs }}");
  {% endif %}
</script>
<script type="application/json" id="vivalty-analytics-config">{{ ANALYTICS_CONFIG_JSON }}</script>
{% if ANALYTICS_PENDING_SIGN_UP %}
<span hidden data-vivalty-analytics-event="sign_up" data-vivalty-analytics-params='{"method":"email"}'></span>
{% endif %}
<script src="{% static 'js/analytics.js' %}" defer></script>
{% endif %}

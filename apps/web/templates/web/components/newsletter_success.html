{# Returned after a successful newsletter signup. `light` = shown on a light background (quiz). #}
<div class="flex items-center gap-3 rounded-2xl border px-5 py-4 text-left animate-fade-in
            {% if light %}border-emerald-300 bg-emerald-50{% else %}border-emerald-300/40 bg-white/10{% endif %}">
  <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-emerald-500 text-white shadow-lg shadow-emerald-500/30">
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
  </span>
  <div>
    <div class="text-sm font-bold {% if light %}text-emerald-900{% else %}text-white{% endif %}">You're on the list.</div>
    <div class="text-xs {% if light %}text-emerald-700{% else %}text-white/60{% endif %}">
      {% if light %}We'll email you homes that match your result.{% else %}Look out for our next market-intelligence roundup.{% endif %}
    </div>
  </div>
</div>

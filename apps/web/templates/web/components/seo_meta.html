{# Reusable SEO head tags. Pass: title, description; optional: canonical, og_image, og_type, robots, json_ld, og_image_alt #}
<title>{{ title }}</title>
<meta name="description" content="{{ description }}" />
<meta name="robots" content="{{ robots|default:'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1' }}" />
<link rel="canonical" href="{{ canonical|default:SEO_CANONICAL_URL }}" />
<meta name="author" content="Vivalty" />
<meta name="application-name" content="Vivalty" />
<meta name="format-detection" content="telephone=no" />
<link rel="alternate" hreflang="en" href="{{ canonical|default:SEO_CANONICAL_URL }}" />
<link rel="alternate" hreflang="x-default" href="{{ canonical|default:SEO_CANONICAL_URL }}" />

<meta property="og:site_name" content="Vivalty" />
<meta property="og:locale" content="en_GB" />
<meta property="og:type" content="{{ og_type|default:'website' }}" />
<meta property="og:title" content="{{ title }}" />
<meta property="og:description" content="{{ description }}" />
<meta property="og:url" content="{{ canonical|default:SEO_CANONICAL_URL }}" />
<meta property="og:image" content="{{ og_image|default:SEO_OG_IMAGE }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:alt" content="{{ og_image_alt|default:'Vivalty — international real estate across 7 destinations' }}" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="@vivalty" />
<meta name="twitter:title" content="{{ title }}" />
<meta name="twitter:description" content="{{ description }}" />
<meta name="twitter:image" content="{{ og_image|default:SEO_OG_IMAGE }}" />
<meta name="twitter:image:alt" content="{{ og_image_alt|default:'Vivalty — international real estate across 7 destinations' }}" />

{% if json_ld %}
<script type="application/ld+json">{{ json_ld|safe }}</script>
{% endif %}
{% if json_ld_extra %}
<script type="application/ld+json">{{ json_ld_extra|safe }}</script>
{% endif %}

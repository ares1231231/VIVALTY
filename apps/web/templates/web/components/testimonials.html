{% load web_extras %}
<section class="py-16 md:py-24 bg-ink-50 border-y border-ink-200/80" aria-labelledby="testimonials-heading">
  <div class="mx-auto max-w-7xl px-6 md:px-8">
    <div class="text-center max-w-2xl mx-auto">
      <span class="inline-flex items-center rounded-full bg-white border border-ink-200 px-3 py-1 text-xs font-bold uppercase tracking-wide text-ink-600 shadow-sm">
        Trusted by buyers worldwide
      </span>
      <h2 id="testimonials-heading" class="mt-4 font-display text-3xl md:text-4xl font-black tracking-tight text-ink-900">
        Real stories from real buyers
      </h2>
      <p class="mt-3 text-ink-600 leading-relaxed">
        International buyers use Vivalty to explore destinations, compare homes and connect with agents — safely and transparently.
      </p>
    </div>

    <div class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      {% for t in testimonials %}
        <figure class="flex flex-col rounded-2xl border border-ink-200 bg-white p-6 shadow-sm transition-shadow hover:shadow-md">
          <div class="flex items-center gap-1 text-amber-400 mb-4" aria-label="{{ t.rating }} out of 5 stars">
            {% for i in "12345" %}
              <svg class="h-4 w-4 {% if forloop.counter <= t.rating %}fill-current{% else %}fill-ink-200 text-ink-200{% endif %}" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            {% endfor %}
          </div>
          <blockquote class="flex-1 text-ink-700 leading-relaxed text-sm md:text-base">
            “{{ t.quote }}”
          </blockquote>
          <figcaption class="mt-5 flex items-center gap-3 pt-5 border-t border-ink-100">
            {% if t.avatar_url %}
              <img src="{{ t.avatar_url }}" alt="" class="h-10 w-10 rounded-full object-cover bg-ink-100" loading="lazy" />
            {% else %}
              <span class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-100 text-brand-800 font-bold text-sm">
                {{ t.name|slice:":1" }}
              </span>
            {% endif %}
            <div>
              <div class="font-bold text-ink-900 text-sm">{{ t.name }}</div>
              {% if t.location %}<div class="text-xs text-ink-500">{{ t.location }}</div>{% endif %}
            </div>
          </figcaption>
        </figure>
      {% endfor %}
    </div>
  </div>
</section>

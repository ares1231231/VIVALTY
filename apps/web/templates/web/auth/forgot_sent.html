{% extends "web/base.html" %}
{% block title %}Reset link sent · Vivalty{% endblock %}

{% block content %}
<div class="flex min-h-[calc(100vh-65px)] items-center justify-center px-6 py-16 bg-ink-50">
  <div class="w-full max-w-md">
    <div class="rounded-2xl border border-ink-200 bg-white p-8 shadow-sm">
      <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-brand-50 text-brand-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-ink-900">Check your email</h1>
      <p class="mt-2 text-sm text-ink-600">
        If an account exists for that address, we've just sent a password reset link. The link expires in 2 hours.
      </p>
      <a href="{% url 'web:login' %}" class="mt-6 btn-secondary w-full justify-center py-2.5 rounded-xl inline-flex">
        Back to sign in
      </a>
    </div>
  </div>
</div>
{% endblock %}

{# Nominatim suggestions dropdown for the location step. #}
{% if suggestions %}
  <div class="rounded-xl border border-ink-200 bg-white shadow-2xl overflow-hidden">
    {% for s in suggestions %}
      <button type="button"
              data-suggestion
              data-address="{{ s.address }}"
              data-lat="{{ s.latitude }}"
              data-lng="{{ s.longitude }}"
              class="w-full text-left px-4 py-3 text-sm border-b border-ink-100 last:border-b-0
                     hover:bg-brand-50 hover:text-brand-800 transition-colors">
        <div class="font-semibold text-ink-900 truncate">{{ s.address }}</div>
        <div class="text-[11px] text-ink-500 truncate">{{ s.label }}</div>
      </button>
    {% endfor %}
  </div>
{% endif %}

{% comment %}
  Bottom action bar — shared across every wizard step.

  Layout: secondary actions left (cancel + back), primary CTA right (continue).
  Mobile becomes a sticky footer bar.
{% endcomment %}
<div class="vv-listing-actions">
  <div class="flex items-center gap-3">
    <a href="{% url 'web:listing_cancel' %}"
       class="text-xs font-semibold text-ink-500 hover:text-rose-600 transition-colors"
       onclick="return confirm('Discard this listing draft? Uploaded photos will be removed.');">
      Cancel
    </a>
    {% if prev_step %}
      <a href="{% url 'web:listing_step' step=prev_step %}"
         class="btn-secondary rounded-xl text-sm px-4">
        ← Back
      </a>
    {% endif %}
  </div>
  <button type="submit" class="btn-primary rounded-xl px-6 py-3 text-sm">
    {% if continue_label %}
      {{ continue_label }}
    {% elif next_step %}
      Next →
    {% else %}
      Preview &amp; publish →
    {% endif %}
  </button>
</div>

{# City autocomplete results for the listing location step. #}
{% if not has_country %}
  <div class="rounded-xl border border-ink-200 bg-white px-4 py-3 text-sm text-ink-500 shadow-2xl">
    Select a country first.
  </div>
{% elif suggestions %}
  <div class="rounded-xl border border-ink-200 bg-white shadow-2xl overflow-hidden max-h-72 overflow-y-auto">
    {% for s in suggestions %}
      <button type="button"
              data-city-suggestion
              data-city-id="{{ s.id }}"
              data-city-name="{{ s.name }}"
              data-lat="{{ s.latitude|default:'' }}"
              data-lng="{{ s.longitude|default:'' }}"
              class="w-full text-left px-4 py-2.5 text-sm border-b border-ink-100 last:border-b-0
                     hover:bg-brand-50 hover:text-brand-800 transition-colors">
        <div class="font-semibold text-ink-900 truncate">{{ s.name }}</div>
        <div class="text-[11px] text-ink-500 truncate">
          {{ s.label }}
          {% if s.source == "remote" %}<span class="ml-1 text-brand-600">· new</span>{% endif %}
        </div>
      </button>
    {% endfor %}
  </div>
{% elif query %}
  <div class="rounded-xl border border-ink-200 bg-white px-4 py-3 text-sm text-ink-600 shadow-2xl">
    No match yet — keep typing, or press Continue to use
    <strong class="text-ink-900">“{{ query }}”</strong> as a new city.
  </div>
{% endif %}

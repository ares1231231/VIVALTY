{# Description textarea — re-rendered after AI rewrite via HTMX. #}
<div id="description-shell" class="space-y-2">
  <textarea name="description"
            id="id_description"
            rows="6"
            placeholder="Tell the story: location & lifestyle, what makes this property distinctive, why now."
            class="input">{{ description|default_if_none:"" }}</textarea>
  {% if polished %}
    <div class="flex items-center gap-2 rounded-lg bg-emerald-50 border border-emerald-200 px-3 py-2 text-xs text-emerald-800">
      <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
      Polished by the Vivalty AI. Tweak any line if you prefer.
    </div>
  {% elif ai_error %}
    <div class="flex items-start gap-2 rounded-lg bg-amber-50 border border-amber-200 px-3 py-2 text-xs text-amber-800">
      <svg class="h-4 w-4 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>
      <span>{{ ai_error }}</span>
    </div>
  {% endif %}
</div>

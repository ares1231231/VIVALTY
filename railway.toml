[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Boot: scripts/railway-start.sh (migrate → gunicorn). Static files are baked
# into the image at build time. /healthz/ must return 200 for Railway's probe.
startCommand = "/app/scripts/railway-start.sh"
healthcheckPath = "/healthz/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
